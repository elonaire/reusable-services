[workspace]
resolver = "2"
members = [
    # Libs
    "lib",
    # Services
    "services/acl-service",
    "services/files",
    "services/email",
    "services/payments",
]

[workspace.dependencies]
# Web / HTTP
axum = "0.8.9"
hyper = "1.11.0"
tower-http = { version = "0.6.11", features = ["cors"] }
tower_governor = "0.8.0"
reqwest = { version = "0.12.28", features = ["json"] }

# Async runtime
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.91"
futures = "0.3.33"

# GraphQL
async-graphql = { version = "7.2.1", features = ["chrono"] }
async-graphql-axum = "7.2.1"

# gRPC / Protobuf
tonic = "0.12.3"
tonic-build = "0.12.3"
tonic-middleware = "0.2.3"
prost = "0.13.5"

# Database
surrealdb = "3.2.4"

# Serialization
serde = "1.0.229"
serde_json = "1.0.151"
prost-types = "0.13.5"

# Tracing / Logging
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"

# Messaging
rumqttc = "0.24.0"

# Utilities
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
cookie = "0.18.1"
uuid = { version = "1.24.0", features = [
    "v4",
    "fast-rng",
    "macro-diagnostics",
] }
base64 = "0.22.1"
anyhow = "1.0.104"
handlebars = "6.4.3"
ammonia = "4.1.4"

# Crypto / Auth
bcrypt = "0.17.1"
jwt-simple = "=0.11.9"
oauth2 = "5.0.0"
rsa = "0.9.10"
rand = "0.8"
hmac = "0.12.1"
sha2 = "0.10.9"
hex = "0.4.3"

# Misc
axum-cookie = "0.2.4"
markdown = "1.0.0"
lettre = { version = "0.11.23", features = ["builder", "serde", "rustls-tls"] }
image = "0.25.10"
kamadak-exif = "0.6.1"

# Internal
lib = { path = "lib" }

[profile.release]
strip = true
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
