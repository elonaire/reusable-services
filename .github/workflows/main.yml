name: CI/CD

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
permissions:
  checks: write
  pull-requests: write
env:
  CARGO_TERM_COLOR: always
  ACL_PATHS: services/acl-service/
  FILES_SERVICE_PATHS: services/files/
  EMAIL_SERVICE_PATHS: services/email/
  PAYMENTS_SERVICE_PATHS: services/payments/
  LIB_PATHS: lib/
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  next_version:
    if: github.event_name != 'push'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0   # needs full history and tags

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install release-plz
        run: cargo install release-plz --locked

      # Edits Cargo.toml/Cargo.lock/changelogs in this runner only; nothing is pushed.
      - name: Compute next version
        run: release-plz update

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          V=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="lib") | .version')
          if [[ -z "$V" ]]; then
            echo "Failed to determine next version."
            exit 1
          fi
          echo "Next version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
  check_service_changes:
    if: github.event_name != 'push'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [next_version]
    outputs:
      workspace_version: ${{ needs.next_version.outputs.version }}
      acl_service_should_deploy: ${{ steps.confirm_changes.outputs.ACL_SHOULD_DEPLOY }}
      files_service_should_deploy: ${{ steps.confirm_changes.outputs.FILES_SHOULD_DEPLOY }}
      email_service_should_deploy: ${{ steps.confirm_changes.outputs.EMAIL_SERVICE_SHOULD_DEPLOY }}
      payments_service_should_deploy: ${{ steps.confirm_changes.outputs.PAYMENTS_SERVICE_SHOULD_DEPLOY }}
    permissions:
      id-token: write  # required to use OIDC authentication
      contents: read  # required to checkout the code from the repo
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0
      - id: confirm_changes
        name: Detect changed services
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # Pick the right base commit for each trigger type.
          case "$EVENT_NAME" in
            pull_request) BASE="$PR_BASE" ;;
            merge_group)  BASE="$MG_BASE" ;;
            push)         BASE="$PUSH_BEFORE" ;;
            *)            BASE="" ;;
          esac
          HEAD="$GITHUB_SHA"
          # No usable base (manual run, first push, force-push, unknown commit):
          # deploy everything rather than silently skipping.
          DEPLOY_ALL=false
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable base commit for event '$EVENT_NAME'; deploying all services."
            DEPLOY_ALL=true
            changed=""
          else
            echo "Base SHA: $BASE"
            echo "Head SHA: $HEAD"
            changed=$(git diff --name-only "$BASE" "$HEAD")
          fi
          echo "Changed files:"
          echo "$changed"
          # Anchored match so e.g. "services/files/src/lib/foo.rs" doesn't count as a change in lib/.
          path_changed() {
            grep -q "^$1" <<< "$changed"
          }
          LIB_CHANGED=false
          if [[ "$DEPLOY_ALL" == "true" ]] || path_changed "$LIB_PATHS"; then
            LIB_CHANGED=true
            echo "lib changed: all services will be deployed."
          fi
          should_deploy() {
            if [[ "$LIB_CHANGED" == "true" ]] || path_changed "$1"; then
              echo "true"
            else
              echo "false"
            fi
          }
          {
            echo "ACL_SHOULD_DEPLOY=$(should_deploy "$ACL_PATHS")"
            echo "FILES_SHOULD_DEPLOY=$(should_deploy "$FILES_SERVICE_PATHS")"
            echo "EMAIL_SERVICE_SHOULD_DEPLOY=$(should_deploy "$EMAIL_SERVICE_PATHS")"
            echo "PAYMENTS_SERVICE_SHOULD_DEPLOY=$(should_deploy "$PAYMENTS_SERVICE_PATHS")"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
  build_and_deploy_acl:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
    # - linux/arm64
    needs: [check_service_changes]
    if: ${{ needs.check_service_changes.outputs.acl_service_should_deploy == 'true' }}
    permissions:
      id-token: write  # required to use OIDC authentication
      contents: read  # required to checkout the code from the repo
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          echo "ACL_REGISTRY_IMAGE=registry.techietenka.com/acl-service" >> $GITHUB_ENV
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACL_REGISTRY_IMAGE }}
      - uses: useblacksmith/checkout@v1
      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: registry.techietenka.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - name: Build and push Docker image
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          # context: .
          # push: true
          tags: ${{ env.ACL_REGISTRY_IMAGE }}
          build-args: |
            SERVICE_NAME=acl-service
            GRPC_PORT=50051
            PORT=3007
          platforms: ${{ matrix.platform }}
          provenance: true  # enables --provenance=mode=max
          sbom: true
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-acl-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-acl-*
          merge-multiple: true
      - name: Docker meta
        id: meta-tag
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACL_REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check_service_changes.outputs.workspace_version }}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.ACL_REGISTRY_IMAGE }}@sha256:%s ' *)
