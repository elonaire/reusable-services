        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.EMAIL_REGISTRY_IMAGE }}@sha256:%s ' *)
  build_and_deploy_files:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
    # - linux/arm64
