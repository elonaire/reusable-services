name: CI/CD

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  checks: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  ACL_PATHS: "services/acl-service/"
  FILES_SERVICE_PATHS: "services/files/"
  EMAIL_SERVICE_PATHS: "services/email/"
  PAYMENTS_SERVICE_PATHS: "services/payments/"
  LIB_PATHS: "lib/"
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  release_plz:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    permissions:
      contents: write
      pull-requests: write

    outputs:
      bumped: ${{ steps.release.outputs.bumped }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout default branch
        uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install release-plz
        run: cargo install release-plz --locked

      - name: Update release metadata
        run: release-plz update

      - name: Create or update release PR
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          V=$(awk '/^\[workspace.package\]/{f=1;next} f&&/^version/{gsub(/.*"|".*/,"");print;exit}' Cargo.toml)

          if [[ -z "$V" ]]; then
            echo "Failed to determine workspace version."
            exit 1
          fi

          echo "version=$V" >> "$GITHUB_OUTPUT"

          git add -A

          if git diff --cached --quiet; then
            echo "No release changes detected."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="release-plz/v${V}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git commit -m "chore: release v${V}"

          # Push only the release branch, never the protected base branch.
          git push --force-with-lease origin "$BRANCH"

          if gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_BRANCH" \
              --title "chore: release v${V}" \
              --body "Automated release PR generated by release-plz."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_BRANCH" \
              --head "$BRANCH" \
              --title "chore: release v${V}" \
              --body "Automated release PR generated by release-plz."
          fi

          echo "bumped=true" >> "$GITHUB_OUTPUT"
  check_service_changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [release_plz]
    outputs:
      workspace_version: ${{ needs.release_plz.outputs.version }}
      acl_service_should_deploy: ${{ steps.confirm_changes.outputs.ACL_SHOULD_DEPLOY }}
      files_service_should_deploy: ${{ steps.confirm_changes.outputs.FILES_SHOULD_DEPLOY }}
      email_service_should_deploy: ${{ steps.confirm_changes.outputs.EMAIL_SERVICE_SHOULD_DEPLOY }}
      payments_service_should_deploy: ${{ steps.confirm_changes.outputs.PAYMENTS_SERVICE_SHOULD_DEPLOY }}

    permissions:
      id-token: write # required to use OIDC authentication
      contents: read # required to checkout the code from the repo

    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0

      - id: file_changes
        name: Check for Service Changes
        run: |
          echo "Base SHA: ${{ github.event.pull_request.base.sha }}"
          echo "Head SHA: ${{ github.sha }}"
          files_temp=$(git diff --name-only --diff-filter=ACMRT ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          files=$(echo "$files_temp" | tr "\n" " ")
          echo "changed_files=$files" >> "$GITHUB_OUTPUT"

      - id: confirm_changes
        name: Confirm Changes
        shell: bash
        run: |
          echo "Changed files: ${{ steps.file_changes.outputs.changed_files }}"
          echo "If you see here files that you have not modified, please update your branch with changes from main."

          # Check if the modified files include this path
          if echo "${{ steps.file_changes.outputs.changed_files }}" | grep -q "${{ env.ACL_PATHS }}" || echo "${{ steps.file_changes.outputs.changed_files }}" | grep -q "${{ env.LIB_PATHS }}"; then
            # Set the output variable and exit the loop
            echo "triggering_path is ${{ env.ACL_PATHS }}"
            echo "ACL_SHOULD_DEPLOY=true" >> "$GITHUB_OUTPUT"
            cat "$GITHUB_OUTPUT"
          else
            echo "ACL_SHOULD_DEPLOY=false" >> "$GITHUB_OUTPUT"

          fi

          if echo "${{ steps.file_changes.outputs.changed_files }}" | grep -q "${{ env.FILES_SERVICE_PATHS }}" || echo "${{ steps.file_changes.outputs.changed_files }}" | grep -q "${{ env.LIB_PATHS }}"; then
            # Set the output variable and exit the loop
            echo "triggering_path is ${{ env.FILES_SERVICE_PATHS }}"
            echo "FILES_SHOULD_DEPLOY=true" >> "$GITHUB_OUTPUT"
            cat "$GITHUB_OUTPUT"
          else
            echo "FILES_SHOULD_DEPLOY=false" >> "$GITHUB_OUTPUT"

          fi

          if echo "${{ steps.file_changes.outputs.changed_files }}" | grep -q "${{ env.EMAIL_SERVICE_PATHS }}" || echo "${{ steps.file_changes.outputs.changed_files }}" | grep -q "${{ env.LIB_PATHS }}"; then
            # Set the output variable and exit the loop
            echo "triggering_path is ${{ env.EMAIL_SERVICE_PATHS }}"
            echo "EMAIL_SERVICE_SHOULD_DEPLOY=true" >> "$GITHUB_OUTPUT"
            cat "$GITHUB_OUTPUT"
          else
            echo "EMAIL_SERVICE_SHOULD_DEPLOY=false" >> "$GITHUB_OUTPUT"

          fi

          if echo "${{ steps.file_changes.outputs.changed_files }}" | grep -q "${{ env.PAYMENTS_SERVICE_PATHS }}" || echo "${{ steps.file_changes.outputs.changed_files }}" | grep -q "${{ env.LIB_PATHS }}"; then
            # Set the output variable and exit the loop
            echo "triggering_path is ${{ env.PAYMENTS_SERVICE_PATHS }}"
            echo "PAYMENTS_SERVICE_SHOULD_DEPLOY=true" >> "$GITHUB_OUTPUT"
            cat "$GITHUB_OUTPUT"
          else
            echo "PAYMENTS_SERVICE_SHOULD_DEPLOY=false" >> "$GITHUB_OUTPUT"

          fi

          exit 0

  build_and_deploy_acl:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          # - linux/arm64
    needs: [check_service_changes]
    if: ${{ needs.check_service_changes.outputs.acl_service_should_deploy == 'true' }}

    permissions:
      id-token: write # required to use OIDC authentication
      contents: read # required to checkout the code from the repo

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          echo "ACL_REGISTRY_IMAGE=registry.techietenka.com/acl-service" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACL_REGISTRY_IMAGE }}

      - uses: useblacksmith/checkout@v1

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: registry.techietenka.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build and push Docker image
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          # context: .
          # push: true
          tags: ${{ env.ACL_REGISTRY_IMAGE }}
          build-args: |
            SERVICE_NAME=acl-service
            GRPC_PORT=50051
            PORT=3007
          platforms: ${{ matrix.platform }}
          provenance: true # enables --provenance=mode=max
          sbom: true
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-acl-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-acl-*
          merge-multiple: true

      - name: Docker meta
        id: meta-tag
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACL_REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check_service_changes.outputs.workspace_version }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.ACL_REGISTRY_IMAGE }}@sha256:%s ' *)

  build_and_deploy_email_service:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          # - linux/arm64
    needs: [check_service_changes]
    if: ${{ needs.check_service_changes.outputs.email_service_should_deploy == 'true' }}

    permissions:
      id-token: write # required to use OIDC authentication
      contents: read # required to checkout the code from the repo

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          echo "EMAIL_REGISTRY_IMAGE=registry.techietenka.com/email-service" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.EMAIL_REGISTRY_IMAGE }}

      - uses: useblacksmith/checkout@v1

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: registry.techietenka.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build and push Docker image
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          # context: .
          # push: true
          tags: ${{ env.EMAIL_REGISTRY_IMAGE }}
          build-args: |
            SERVICE_NAME=email
            GRPC_PORT=50052
            PORT=3019
          platforms: ${{ matrix.platform }}
          provenance: true # enables --provenance=mode=max
          sbom: true
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-email-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-email-*
          merge-multiple: true

      - name: Docker meta
        id: meta-tag
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.EMAIL_REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check_service_changes.outputs.workspace_version }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.EMAIL_REGISTRY_IMAGE }}@sha256:%s ' *)

  build_and_deploy_files:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          # - linux/arm64
    needs: [check_service_changes]
    if: ${{ needs.check_service_changes.outputs.files_service_should_deploy == 'true' }}

    permissions:
      id-token: write # required to use OIDC authentication
      contents: read # required to checkout the code from the repo

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          echo "FILES_REGISTRY_IMAGE=registry.techietenka.com/files-service" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FILES_REGISTRY_IMAGE }}

      - uses: useblacksmith/checkout@v1

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: registry.techietenka.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build and push Docker image
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          # context: .
          # push: true
          tags: ${{ env.FILES_REGISTRY_IMAGE }}
          build-args: |
            SERVICE_NAME=files
            GRPC_PORT=50053
            PORT=3001
          platforms: ${{ matrix.platform }}
          provenance: true # enables --provenance=mode=max
          sbom: true
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-files-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-files-*
          merge-multiple: true

      - name: Docker meta
        id: meta-tag
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FILES_REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check_service_changes.outputs.workspace_version }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.FILES_REGISTRY_IMAGE }}@sha256:%s ' *)

  build_and_deploy_payments_service:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          # - linux/arm64
    needs: [check_service_changes]
    if: ${{ needs.check_service_changes.outputs.payments_service_should_deploy == 'true' }}

    permissions:
      id-token: write # required to use OIDC authentication
      contents: read # required to checkout the code from the repo

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          echo "PAYMENTS_REGISTRY_IMAGE=registry.techietenka.com/payments-service" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PAYMENTS_REGISTRY_IMAGE }}

      - uses: useblacksmith/checkout@v1

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: registry.techietenka.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build and push Docker image
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          # context: .
          # push: true
          tags: ${{ env.PAYMENTS_REGISTRY_IMAGE }}
          build-args: |
            SERVICE_NAME=payments
            GRPC_PORT=50056
            PORT=3013
          platforms: ${{ matrix.platform }}
          provenance: true # enables --provenance=mode=max
          sbom: true
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-payments-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-payments-*
          merge-multiple: true

      - name: Docker meta
        id: meta-tag
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PAYMENTS_REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check_service_changes.outputs.workspace_version }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.PAYMENTS_REGISTRY_IMAGE }}@sha256:%s ' *)

  automerge:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    permissions:
      contents: write
      pull-requests: write

    needs:
      [
        build_and_deploy_acl,
        build_and_deploy_email_service,
        build_and_deploy_files,
        build_and_deploy_payments_service,
        release_plz,
        check_service_changes,
      ]

    if: |
      always() &&
      needs.release_plz.result == 'success' &&
      needs.check_service_changes.result == 'success' &&
      needs.build_and_deploy_acl.result != 'failure' &&
      needs.build_and_deploy_acl.result != 'cancelled' &&
      needs.build_and_deploy_files.result != 'failure' &&
      needs.build_and_deploy_files.result != 'cancelled' &&
      needs.build_and_deploy_email_service.result != 'failure' &&
      needs.build_and_deploy_email_service.result != 'cancelled' &&
      needs.build_and_deploy_payments_service.result != 'failure' &&
      needs.build_and_deploy_payments_service.result != 'cancelled'

    steps:
      - id: automerge
        name: automerge
        uses: "pascalgn/automerge-action@v0.16.4"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MERGE_LABELS: ""
